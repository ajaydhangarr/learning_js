<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f2f4f7
        }

        .calculator {
            background: #fff;
            width: 300px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1)
        }

        .display {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 10px;
            background: #f7f7f7;
            font-size: 26px;
            text-align: right;
            padding: 10px;
            margin-bottom: 15px
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px
        }

        button {
            height: 55px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            background: #e9ecf1
        }

        button:active {
            transform: scale(0.97)
        }

        .operator {
            background: #ffd166
        }

        .equal {
            grid-column: span 2;
            background: #06d6a0;
            color: #fff
        }

        .clear {
            background: #ef476f;
            color: #fff
        }
    </style>
</head>

<body>
    <div class="calculator">
        <input type="text" class="display" id="display" readonly>
        <div class="buttons">
            <button class="clear" onclick="clearDisplay()">C</button>
            <button onclick="deleteChar()">DEL</button>
            <button class="operator" onclick="append('%')">%</button>
            <button class="operator" onclick="append('/')">÷</button>
            <button onclick="append('7')">7</button>
            <button onclick="append('8')">8</button>
            <button onclick="append('9')">9</button>
            <button class="operator" onclick="append('*')">×</button>
            <button onclick="append('4')">4</button>
            <button onclick="append('5')">5</button>
            <button onclick="append('6')">6</button>
            <button class="operator" onclick="append('-')">−</button>
            <button onclick="append('1')">1</button>
            <button onclick="append('2')">2</button>
            <button onclick="append('3')">3</button>
            <button class="operator" onclick="append('+')">+</button>
            <button onclick="append('0')">0</button>
            <button onclick="append('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>
    <script>
        let display = document.getElementById('display')
        function append(value) { display.value += value }
        function clearDisplay() { display.value = '' }
        function deleteChar() { display.value = display.value.slice(0, -1) }
        function calculate() { display.value ="manish ki gaand"
            // try { display.value = eval(display.value) } catch { display.value = 'Error' }
         }
    </script>
</body>

</html>
